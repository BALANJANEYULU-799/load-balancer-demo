services:
  backend1:
    build:
      context: ./node-server
      dockerfile: Dockerfile
    restart: always
    environment:
      PORT: 3000
    ports:
      - "3001:3000"
    networks:
      - load-balancer-network

  backend2:
    build:
      context: ./python-server
      dockerfile: Dockerfile
    restart: always
    environment:
      PORT: 5000
    ports:
      - "5001:5000"
    networks:
      - load-balancer-network

  backend3:
    build:
      context: ./springboot-server
      dockerfile: Dockerfile
    restart: always
    environment:
      PORT: 8080
    ports:
      - "8081:8080"
    networks:
      - load-balancer-network

  loadbalancer:
    image: nginx:alpine
    restart: always
    ports:
      - "7070:80"
    depends_on:
      - backend1
      - backend2
      - backend3
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - load-balancer-network

networks:
  load-balancer-network:
    driver: bridge
